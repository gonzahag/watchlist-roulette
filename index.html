<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16261F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ruleta de Watchlist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
--velvet:#16261F;
--velvet-2:#1E332A;
--velvet-3:#28402F;
--cream:#F2E9D8;
--cream-dim:#E4D8BC;
--brass:#C9A24B;
--brass-dim:#A9843A;
--crimson:#9C2B24;
--ink:#241F1C;
--shadow: rgba(0,0,0,0.45);
--font-display:'Bebas Neue', 'Arial Narrow', sans-serif;
--font-body:'Libre Franklin', -apple-system, sans-serif;
--font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
font-family:var(--font-body);
background:
radial-gradient(ellipse at top, var(--velvet-3) 0%, var(--velvet) 55%, #0e1a14 100%);
color:var(--cream);
min-height:100dvh;
display:flex;
justify-content:center;
padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
overflow-x:hidden;
}
.app{
width:100%;
max-width:440px;
display:flex;
flex-direction:column;
gap:18px;
}
/* ---------- Header ---------- */
.marquee{
text-align:center;
padding-top:6px;
}
.marquee .eyebrow{
font-family:var(--font-mono);
font-size:11px;
letter-spacing:4px;
color:var(--brass);
text-transform:uppercase;
opacity:.85;
}
.marquee h1{
font-family:var(--font-display);
font-size:44px;
letter-spacing:2px;
margin:2px 0 0;
color:var(--cream);
line-height:1;
}
.marquee h1 span{color:var(--brass);}
.marquee .sub{
font-size:13px;
color:var(--cream-dim);
margin-top:6px;
opacity:.8;
}
/* ---------- Ticket card ---------- */
.ticket{
background:var(--cream);
color:var(--ink);
border-radius:14px;
position:relative;
box-shadow:0 18px 40px var(--shadow);
overflow:hidden;
}
.ticket::before, .ticket::after{
content:"";
position:absolute;
left:0; right:0;
height:16px;
background-image: radial-gradient(circle 8px, var(--velvet) 8px, transparent 8.5px);
background-size:24px 16px;
background-repeat:repeat-x;
background-position:center;
}
.ticket::before{ top:-8px; }
.ticket::after{ bottom:-8px; }
.ticket-inner{
padding:22px 20px 26px;
}
.upload-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding-bottom:16px;
border-bottom:1px dashed rgba(36,31,28,.25);
margin-bottom:16px;
}
.upload-info{display:flex; flex-direction:column; gap:2px;}
.upload-info .label{
font-family:var(--font-mono);
font-size:10px;
letter-spacing:2px;
text-transform:uppercase;
color:var(--crimson);
font-weight:600;
}
.upload-info .count{
font-size:14px;
font-weight:600;
}
.row-btns{ display:flex; align-items:center; gap:8px; }
.upload-btn{
font-family:var(--font-mono);
font-size:11px;
letter-spacing:1px;
text-transform:uppercase;
color:var(--cream);
background:var(--ink);
border:none;
padding:10px 14px;
border-radius:8px;
cursor:pointer;
white-space:nowrap;
transition:transform .15s ease, background .15s ease;
}
.upload-btn:active{ transform:scale(.96); }
.icon-btn{
width:36px; height:36px;
border-radius:8px;
border:none;
background:rgba(36,31,28,.08);
color:var(--ink);
font-size:16px;
cursor:pointer;
flex-shrink:0;
transition:transform .15s ease;
}
.icon-btn:active{ transform:scale(.9) rotate(20deg); }
#fileInput{display:none;}
/* ---------- Poster ---------- */
.poster-wrap{
width:120px;
height:178px;
margin:0 auto 14px;
border-radius:8px;
overflow:hidden;
background:linear-gradient(135deg, #d8cba8, #c7b78e);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 18px rgba(0,0,0,.25);
}
.poster-wrap img{
width:100%; height:100%;
object-fit:cover;
display:block;
}
.poster-wrap svg{ width:34px; height:34px; opacity:.4; }
.poster-wrap.loading{ animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
.jw-btn{
display:block;
width:100%;
font-family:var(--font-body);
font-weight:600;
font-size:13px;
padding:11px 8px;
border-radius:9px;
border:1px solid rgba(36,31,28,.18);
background:transparent;
color:var(--ink);
cursor:pointer;
margin-bottom:10px;
text-decoration:none;
text-align:center;
}
/* ---------- Empty state ---------- */
.empty{
text-align:center;
padding:34px 8px 10px;
display:flex;
flex-direction:column;
align-items:center;
gap:14px;
}
.empty svg{width:56px; height:56px; opacity:.55;}
.empty p{
margin:0;
font-size:14px;
line-height:1.5;
color:rgba(36,31,28,.75);
max-width:280px;
}
.empty .cta{
font-family:var(--font-display);
font-size:22px;
letter-spacing:1px;
background:var(--brass);
color:var(--ink);
border:none;
padding:12px 28px;
border-radius:10px;
cursor:pointer;
}
/* ---------- Reel ---------- */
.reel-wrap{ display:none; flex-direction:column; gap:16px; }
.reel-wrap.active{ display:flex; }
.reel-window{
position:relative;
height:288px;
overflow:hidden;
border-radius:8px;
background:linear-gradient(180deg, var(--ink), #34302a);
}
.reel-track{
position:absolute;
top:0; left:0; right:0;
will-change:transform;
}
.reel-item{
height:72px;
display:flex;
align-items:center;
gap:12px;
padding:0 46px;
color:var(--cream-dim);
font-size:15px;
}
.reel-item .yr{
font-family:var(--font-mono);
font-size:11px;
color:var(--brass-dim);
flex-shrink:0;
}
.reel-item .nm{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-weight:500;
}
.reel-window::before, .reel-window::after{
content:"";
position:absolute;
left:0; right:0;
height:108px;
pointer-events:none;
z-index:2;
}
.reel-window::before{ top:0; background:linear-gradient(180deg, var(--ink) 10%, transparent); }
.reel-window::after{ bottom:0; background:linear-gradient(0deg, var(--ink) 10%, transparent); }
.reel-frame{
position:absolute;
top:50%; left:0; right:0;
height:72px;
transform:translateY(-50%);
border-top:2px solid var(--brass);
border-bottom:2px solid var(--brass);
z-index:3;
pointer-events:none;
box-shadow:0 0 0 9999px rgba(0,0,0,0) ;
}
.reel-frame .sprockets{
position:absolute;
top:50%; transform:translateY(-50%);
width:10px; height:10px;
border-radius:50%;
background:var(--brass);
}
.reel-frame .sprockets.l{ left:14px; }
.reel-frame .sprockets.r{ right:14px; }
.spin-btn{
font-family:var(--font-display);
font-size:26px;
letter-spacing:2px;
color:var(--ink);
background:linear-gradient(180deg, var(--brass), var(--brass-dim));
border:none;
border-radius:12px;
padding:16px;
cursor:pointer;
box-shadow:0 8px 0 #7a5d28, 0 12px 20px rgba(0,0,0,.35);
transition:transform .08s ease, box-shadow .08s ease;
}
.spin-btn:active{
transform:translateY(6px);
box-shadow:0 2px 0 #7a5d28, 0 4px 10px rgba(0,0,0,.3);
}
.spin-btn:disabled{
opacity:.55;
cursor:default;
transform:none;
box-shadow:0 8px 0 #7a5d28, 0 12px 20px rgba(0,0,0,.2);
}
.hint{
text-align:center;
font-size:11px;
color:rgba(36,31,28,.55);
}
/* ---------- Result overlay ---------- */
.overlay{
position:fixed; inset:0;
background:rgba(14,26,20,.82);
backdrop-filter:blur(3px);
display:flex;
align-items:center;
justify-content:center;
padding:24px;
opacity:0; pointer-events:none;
transition:opacity .3s ease;
z-index:10;
}
.overlay.show{ opacity:1; pointer-events:auto; }
.result-card{
background:var(--cream);
color:var(--ink);
border-radius:16px;
padding:28px 24px 24px;
width:100%;
max-width:360px;
text-align:center;
transform:scale(.9);
transition:transform .3s ease;
box-shadow:0 30px 60px rgba(0,0,0,.5);
}
.overlay.show .result-card{ transform:scale(1); }
.result-card .stamp{
font-family:var(--font-mono);
font-size:11px;
letter-spacing:3px;
color:var(--crimson);
text-transform:uppercase;
margin-bottom:6px;
}
.result-card h2{
font-family:var(--font-display);
font-size:32px;
letter-spacing:1px;
margin:0 0 4px;
line-height:1.05;
}
.result-card .yr{
font-family:var(--font-mono);
font-size:13px;
color:var(--brass-dim);
margin-bottom:18px;
}
.result-card a.lb-link{
display:inline-block;
font-size:12px;
color:var(--velvet);
text-decoration:underline;
margin-bottom:18px;
}
.result-actions{
display:flex;
gap:10px;
}
.result-actions button{
flex:1;
font-family:var(--font-body);
font-weight:600;
font-size:13px;
padding:12px 8px;
border-radius:9px;
border:none;
cursor:pointer;
}
.btn-keep{ background:rgba(36,31,28,.08); color:var(--ink); }
.btn-remove{ background:var(--crimson); color:var(--cream); }
/* ---------- Toast ---------- */
.toast{
position:fixed;
left:50%; bottom:28px;
transform:translateX(-50%) translateY(20px);
background:var(--ink);
color:var(--cream);
font-size:13px;
padding:11px 18px;
border-radius:9px;
opacity:0;
pointer-events:none;
transition:opacity .25s ease, transform .25s ease;
z-index:20;
max-width:90%;
text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce){
.reel-track{ transition:none !important; }
}
</style>
</head>
<body>
<div class="app">
<div class="marquee">
<div class="eyebrow">Lo que ibas a ver "algún día"</div>
<h1>WATCHLIST ROULETTE</h1>
<div class="sub">Subí tu watchlist de Letterboxd y dejá que la suerte elija</div>
</div>

<div class="ticket">
<div class="ticket-inner">
<div class="upload-row">
<div class="upload-info">
<div class="label">Watchlist</div>
<div class="count" id="countText">Sin datos cargados</div>
</div>
<div class="row-btns">
<button class="upload-btn" id="uploadBtn">Carga tu watchlist</button>
</div>
<input type="file" id="fileInput" accept=".csv,text/csv">
</div>

<div class="empty" id="emptyState">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="32" cy="32" r="26" stroke="#241F1C" stroke-width="4"/>
<circle cx="32" cy="14" r="5" fill="#241F1C"/>
<circle cx="46" cy="38" r="5" fill="#241F1C"/>
<circle cx="18" cy="38" r="5" fill="#241F1C"/>
</svg>
<p>Todavía no cargaste ninguna watchlist. Exportala desde Letterboxd (Watchlist &gt; Export Watchlist) y subí el archivo!</p>
<button class="cta" id="emptyUploadBtn">Elegir archivo</button>
</div>

<div class="reel-wrap" id="reelWrap">
<div class="reel-window" id="reelWindow">
<div class="reel-track" id="reelTrack"></div>
<div class="reel-frame">
<div class="sprockets l"></div>
<div class="sprockets r"></div>
</div>
</div>
<button class="spin-btn" id="spinBtn">GIRAR</button>
<div class="hint" id="hintText"></div>
</div>

</div>
</div>
</div>

<div class="overlay" id="overlay">
<div class="result-card">
<div class="stamp">Función confirmada</div>
<div class="poster-wrap" id="posterWrap">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="8" y="6" width="48" height="52" rx="3" stroke="#241F1C" stroke-width="3"/>
<path d="M8 20h48M20 6v14M44 6v14" stroke="#241F1C" stroke-width="3"/>
</svg>
</div>
<h2 id="resTitle">—</h2>
<div class="yr" id="resYear"></div>
<div id="resLinkWrap"></div>
<a class="jw-btn" id="jwBtn" target="_blank" rel="noopener">Buscar en JustWatch</a>
<div class="result-actions">
<button class="btn-keep" id="btnKeep">Dejarla en la lista</button>
<button class="btn-remove" id="btnRemove">Sacarla de la lista</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const ITEM_H = 72;
const LOOPS = 7;
let movies = [];
let spinning = false;
let pendingIndex = null;
let pendingPosterPromise = null;

const el = id => document.getElementById(id);
const fileInput = el('fileInput');
const uploadBtn = el('uploadBtn');
const emptyUploadBtn = el('emptyUploadBtn');
const emptyState = el('emptyState');
const reelWrap = el('reelWrap');
const reelTrack = el('reelTrack');
const reelWindow = el('reelWindow');
const spinBtn = el('spinBtn');
const countText = el('countText');
const hintText = el('hintText');
const overlay = el('overlay');
const posterWrap = el('posterWrap');
const resTitle = el('resTitle');
const resYear = el('resYear');
const resLinkWrap = el('resLinkWrap');
const jwBtn = el('jwBtn');
const btnKeep = el('btnKeep');
const btnRemove = el('btnRemove');
const toastEl = el('toast');

/* ---------- Almacenamiento local (persiste en este navegador una vez alojada la app) ---------- */
function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('No se pudo guardar', key, e); }
}

// Pegá acá la URL de tu Cloudflare Worker (el que esconde la API key de TMDB).
// Ej: 'https://tmdb-poster-proxy.tu-usuario.workers.dev'
const PROXY_URL = 'https://tmdb-poster-proxy.gonzahag.workers.dev';

let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2600);
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function moviesFromCSV(text){
  const rows = parseCSV(text).filter(r => r.length && r.some(v => v.trim() !== ''));
  if (!rows.length) return [];
  const header = rows[0].map(h => h.trim().toLowerCase());
  const nameIdx = header.indexOf('name');
  const yearIdx = header.indexOf('year');
  const uriIdx = header.findIndex(h => h.includes('uri'));
  if (nameIdx === -1) return [];
  return rows.slice(1)
    .filter(r => r[nameIdx] && r[nameIdx].trim() !== '')
    .map(r => ({
      name: r[nameIdx].trim(),
      year: yearIdx >= 0 ? (r[yearIdx] || '').trim() : '',
      uri: uriIdx >= 0 ? (r[uriIdx] || '').trim() : ''
    }));
}

async function saveMovies(){
  saveJSON('watchlist', movies);
}
async function loadMovies(){
  movies = loadJSON('watchlist', []);
}

function buildTrack(loops){
  const frag = document.createDocumentFragment();
  for (let l = 0; l < loops; l++){
    movies.forEach(m => {
      const div = document.createElement('div');
      div.className = 'reel-item';
      div.innerHTML = `<span class="yr">${m.year || ''}</span><span class="nm">${escapeHtml(m.name)}</span>`;
      frag.appendChild(div);
    });
  }
  reelTrack.innerHTML = '';
  reelTrack.appendChild(frag);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const n = movies.length;
  countText.textContent = n === 0 ? 'Sin datos cargados' : `${n} película${n === 1 ? '' : 's'} en la lista`;
  if (n === 0){
    emptyState.style.display = 'flex';
    reelWrap.classList.remove('active');
  } else {
    emptyState.style.display = 'none';
    reelWrap.classList.add('active');
    reelTrack.style.transition = 'none';
    buildTrack(2);
    reelTrack.style.transform = 'translateY(0px)';
    hintText.textContent = `Tocá GIRAR y se elige una al azar entre las ${n}.`;
  }
  spinBtn.disabled = n === 0;
}

function spin(){
  if (spinning || movies.length === 0) return;
  spinning = true;
  spinBtn.disabled = true;
  hintText.textContent = 'Girando...';

  const n = movies.length;
  const targetIndex = Math.floor(Math.random() * n);
  const finalPos = LOOPS * n + targetIndex;

  buildTrack(LOOPS + 2);
  reelTrack.style.transition = 'none';
  reelTrack.style.transform = 'translateY(0px)';
  void reelTrack.offsetHeight;

  const winH = reelWindow.clientHeight;
  const offset = finalPos * ITEM_H - (winH / 2 - ITEM_H / 2);

  requestAnimationFrame(() => {
    reelTrack.style.transition = 'transform 3.4s cubic-bezier(0.13, 0.82, 0.16, 1)';
    reelTrack.style.transform = `translateY(-${offset}px)`;
  });

  pendingIndex = targetIndex;

  // Arrancamos el pedido del póster ya mismo, en paralelo con la animación
  // del giro (3.5s), para que cuando termine de girar el póster ya esté listo.
  pendingPosterPromise = fetchPoster(movies[targetIndex]);

  setTimeout(() => {
    spinning = false;
    spinBtn.disabled = false;
    hintText.textContent = `Tocá GIRAR y se elige una al azar entre las ${n}.`;
    showResult(movies[targetIndex]);
  }, 3500);
}

async function fetchPoster(movie){
  const cache = loadJSON('posterCache', {});
  const cacheKey = `${movie.name}__${movie.year}`;
  if (cache[cacheKey] !== undefined) return cache[cacheKey];

  try{
    if (!PROXY_URL) return null;

    // Pedimos el póster al Worker, que tiene la key de TMDB escondida del lado del servidor.
    const params = new URLSearchParams({ query: movie.name });
    if (movie.year) params.set('year', movie.year);
    const res = await fetch(`${PROXY_URL}/poster?${params.toString()}`);
    let posterPath = null;
    if (res.ok){
      const data = await res.json();
      posterPath = data.poster_path;
    }

    const posterUrl = posterPath ? `https://image.tmdb.org/t/p/w342${posterPath}` : null;
    cache[cacheKey] = posterUrl;
    saveJSON('posterCache', cache);
    return posterUrl;
  }catch(e){
    console.error('No se pudo buscar el póster', e);
    return null;
  }
}

function justwatchUrl(movie){
  return `https://www.justwatch.com/ar/buscar?q=${encodeURIComponent(movie.name)}`;
}

function slugify(title){
  return title
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // saca acentos
    .toLowerCase()
    .replace(/['’.]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

const posterPlaceholder = posterWrap.innerHTML;

async function showResult(movie){
  resTitle.textContent = movie.name;
  resYear.textContent = movie.year || '';
  resLinkWrap.innerHTML = movie.uri
    ? `<a class="lb-link" href="${movie.uri}" target="_blank" rel="noopener">Ver en Letterboxd →</a>`
    : '';
  jwBtn.href = justwatchUrl(movie);

  posterWrap.innerHTML = posterPlaceholder;
  posterWrap.classList.add('loading');
  overlay.classList.add('show');

  // Reutilizamos el pedido que ya arrancó durante el giro, en vez de
  // pedirlo de nuevo desde cero (así se siente casi instantáneo).
  const posterUrl = await (pendingPosterPromise || fetchPoster(movie));
  pendingPosterPromise = null;

  posterWrap.classList.remove('loading');
  if (posterUrl){
    const img = new Image();
    img.alt = `Póster de ${movie.name}`;
    img.src = posterUrl;
    posterWrap.innerHTML = '';
    posterWrap.appendChild(img);
  }
}

function hideOverlay(){
  overlay.classList.remove('show');
}

btnKeep.addEventListener('click', hideOverlay);

// Clic en el fondo oscuro (fuera de la tarjeta) cierra igual que "Dejarla en la lista".
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) hideOverlay();
});

btnRemove.addEventListener('click', async () => {
  if (pendingIndex === null) return;
  const removed = movies[pendingIndex];
  movies.splice(pendingIndex, 1);
  pendingIndex = null;
  await saveMovies();
  render();
  hideOverlay();
  toast(`"${removed.name}" se sacó de la watchlist`);
});

uploadBtn.addEventListener('click', () => fileInput.click());
emptyUploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try{
    const text = await file.text();
    const parsed = moviesFromCSV(text);
    if (!parsed.length){
      toast('No se encontraron películas en ese archivo. ¿Es el CSV de la Watchlist?');
      return;
    }
    movies = parsed;
    await saveMovies();
    render();
    toast(`Watchlist actualizada: ${movies.length} película${movies.length === 1 ? '' : 's'}`);
  }catch(err){
    console.error(err);
    toast('No se pudo leer el archivo. Probá de nuevo.');
  }
  fileInput.value = '';
});

spinBtn.addEventListener('click', spin);

(async function init(){
  await loadMovies();
  render();
})();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('No se pudo registrar el service worker', err);
    });
  });
}
</script>
</body>
</html>
